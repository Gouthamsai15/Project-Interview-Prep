    ["Dynamic Programming & Greedy","Longest increasing subsequence?","DP is O(n^2). With binary search on a tails array it is O(n log n)."],

    ["Patterns & Techniques","What is the fast and slow pointer technique?","Two pointers at different speeds. Used for cycle detection and finding the middle of a linked list."],
    ["Patterns & Techniques","What is bit manipulation? Common tricks?","Working with bits. n & (n - 1) clears the lowest set bit. n & 1 checks odd. x ^ x = 0 finds the single non-repeating number. 1 << k sets the kth bit mask."],
    ["Patterns & Techniques","How do you check if a number is a power of 2?","n > 0 and (n & (n - 1)) == 0."],
    ["Patterns & Techniques","What is the difference between BFS and Dijkstra?","BFS finds shortest paths in unweighted graphs using a queue. Dijkstra handles weighted graphs using a priority queue."],
    ["Patterns & Techniques","How do you choose a data structure?","Need fast lookup: hash map. Need order or ranges: sorted array or tree. Need min or max repeatedly: heap. Need LIFO: stack. Need FIFO or level order: queue. Need relationships: graph."],

    ["Situation Based","Your solution is too slow. What do you do?","Find the bottleneck, remove repeated work with a hash map or cache, sort or preprocess, use two pointers or a heap, or apply binary search or DP."],

    ["Situation Based","How would you design an LRU cache?","A hash map plus a doubly linked list. The map gives O(1) lookup, and the list keeps usage order so the least recently used node is removed in O(1)."],
    ["Situation Based","How would you find the top k frequent items in a large stream?","Count with a hash map and keep a min-heap of size k. For huge streams, use approximate methods like count-min sketch."]

{t:"8. Hashing", h:
 nP("A hash function maps a key to an index. Lookup, insert and delete are O(1) on average and O(n) in the worst case.")+

 nC("# Two Sum\ndef two_sum(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target - x in seen:\n            return [seen[target - x], i]\n        seen[x] = i\n\n# Subarray sum equals k (prefix sum + map)\ndef count_subarrays(nums, k):\n    cnt = {0: 1}; s = res = 0\n    for x in nums:\n        s += x\n        res += cnt.get(s - k, 0)\n        cnt[s] = cnt.get(s, 0) + 1\n    return res")},

{t:"10. Binary Search Tree & Trie", h:
 nP("BST rule: left subtree values are smaller, right subtree values are larger. Inorder traversal gives sorted output. Average O(log n), worst case O(n) when skewed.")+
 nC("def search(root, key):\n    while root and root.val != key:\n        root = root.left if key < root.val else root.right\n    return root\n\ndef is_valid(n, lo=float('-inf'), hi=float('inf')):\n    if not n: return True\n    if not (lo < n.val < hi): return False\n    return is_valid(n.left, lo, n.val) and is_valid(n.right, n.val, hi)")+

{t:"11. Heap & Priority Queue", h:
 nP("A complete binary tree where each parent is smaller (min-heap) or larger (max-heap) than its children. Stored in an array: children of index i are 2i+1 and 2i+2.")+
 nT(["Operation","Complexity"],[["Peek min / max","O(1)"],["Insert","O(log n)"],["Extract min / max","O(log n)"],["Build heap","O(n)"],["Heap sort","O(n log n)"]])+
 nC("import heapq\nh = []\nheapq.heappush(h, 5)\nheapq.heappush(h, 1)\nheapq.heappop(h)          # 1 (min-heap)\n\n# kth largest: keep min-heap of size k\ndef kth_largest(nums, k):\n    h = nums[:k]; heapq.heapify(h)\n    for x in nums[k:]:\n        if x > h[0]: heapq.heapreplace(h, x)\n    return h[0]")+

{t:"12. Graphs", h:
 nT(["Representation","Space","Edge check","Best for"],[["Adjacency matrix","O(V^2)","O(1)","Dense graphs"],["Adjacency list","O(V + E)","O(degree)","Sparse graphs"]])+
 nC("from collections import deque\n\ndef bfs(graph, start):\n    seen = {start}; q = deque([start])\n    while q:\n        node = q.popleft()\n        for nb in graph[node]:\n            if nb not in seen:\n                seen.add(nb); q.append(nb)\n\ndef dfs(graph, node, seen):\n    seen.add(node)\n    for nb in graph[node]:\n        if nb not in seen:\n            dfs(graph, nb, seen)")+
 nT(["Algorithm","Purpose","Complexity"],[["BFS","Shortest path (unweighted), levels","O(V + E)"],["DFS","Connected components, cycles, paths","O(V + E)"],["Topological sort","Order tasks in a DAG","O(V + E)"],["Dijkstra","Shortest path, non-negative weights","O((V + E) log V)"],["Bellman-Ford","Negative weights","O(V x E)"],["Floyd-Warshall","All pairs shortest path","O(V^3)"],["Kruskal / Prim","Minimum spanning tree","O(E log E)"],["Union-Find","Connected groups, cycle detection","Almost O(1)"]])},

{t:"13. Recursion & Backtracking", h:
 nP("Every recursion needs a base case and a smaller subproblem. Backtracking tries a choice, recurses, then undoes the choice.")+
 nC("def factorial(n):\n    return 1 if n <= 1 else n * factorial(n - 1)\n\n# subsets with backtracking\ndef subsets(nums):\n    res, path = [], []\n    def go(i):\n        if i == len(nums):\n            res.append(path[:]); return\n        go(i + 1)              # skip\n        path.append(nums[i])   # choose\n        go(i + 1)\n        path.pop()             # undo\n    go(0)\n    return res")+
 nT(["Problem","Count / complexity"],[["Subsets","2^n"],["Permutations","n!"],["N-Queens","Pruned search, exponential"],["Sudoku solver","Pruned search"],["Combination sum","Depends on target"]])},

{t:"14. Sorting Algorithms", h:
 nC("def merge_sort(a):\n    if len(a) <= 1: return a\n    mid = len(a) // 2\n    l, r = merge_sort(a[:mid]), merge_sort(a[mid:])\n    out = []\n    while l and r:\n        out.append(l.pop(0) if l[0] <= r[0] else r.pop(0))\n    return out + l + r\n\ndef quick_sort(a):\n    if len(a) <= 1: return a\n    p = a[len(a) // 2]\n    return (quick_sort([x for x in a if x < p]) +\n            [x for x in a if x == p] +\n            quick_sort([x for x in a if x > p]))")+
 nT(["Algorithm","Idea","Best use"],[["Bubble","Swap adjacent out-of-order items","Teaching only"],["Selection","Pick the smallest each time","Few writes needed"],["Insertion","Insert each item into sorted part","Small or nearly sorted data"],["Merge","Divide, sort halves, merge","Stable sort, linked lists"],["Quick","Partition around a pivot","General purpose, fast in practice"],["Heap","Use a heap to extract max","Guaranteed O(n log n), in place"],["Counting / Radix","Count digits or values","Integers in small range"]])+
 nP("Python's sorted() and list.sort() use Timsort: stable, O(n log n).")},

{t:"15. Searching & Binary Search", h:
 nT(["Search","Requirement","Complexity"],[["Linear","None","O(n)"],["Binary","Sorted data","O(log n)"],["Hash lookup","Hash table","O(1) average"],["BST search","Balanced BST","O(log n)"]])+
 nC("def binary_search(a, target):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = lo + (hi - lo) // 2\n        if a[mid] == target: return mid\n        if a[mid] < target: lo = mid + 1\n        else: hi = mid - 1\n    return -1")+
 nL(["Binary search on the answer: search a range of possible answers and test feasibility","Lower bound: first index with value >= target","Rotated sorted array: find the sorted half each step","Always check mid calculation and loop condition (off-by-one errors)"])},

{t:"16. Two Pointers & Sliding Window", h:
 nT(["Technique","When to use","Example"],[["Two pointers (opposite ends)","Sorted array, pair or palindrome","Pair with target sum"],["Two pointers (same direction)","Remove duplicates, partition","Move zeroes"],["Fast and slow pointers","Linked list cycle or middle","Floyd's cycle detection"],["Fixed sliding window","Subarray of size k","Max sum of k elements"],["Variable sliding window","Longest or shortest subarray with a condition","Longest substring without repeats"]])+
 nC("# longest substring without repeating characters\ndef longest_unique(s):\n    seen = {}; left = best = 0\n    for right, ch in enumerate(s):\n        if ch in seen and seen[ch] >= left:\n            left = seen[ch] + 1\n        seen[ch] = right\n        best = max(best, right - left + 1)\n    return best")},

{t:"17. Dynamic Programming", h:
 nP("DP solves problems with overlapping subproblems and optimal substructure by storing results. Steps: define the state, write the recurrence, set base cases, choose the order, and optimize space.")+
 nT(["Style","Description"],[["Memoization (top-down)","Recursion plus cache"],["Tabulation (bottom-up)","Fill a table iteratively"]])+
 nC("# Fibonacci, O(n) time, O(1) space\ndef fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\n\n# Coin change (minimum coins)\ndef coin_change(coins, amount):\n    dp = [0] + [float('inf')] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a:\n                dp[a] = min(dp[a], dp[a - c] + 1)\n    return dp[amount] if dp[amount] != float('inf') else -1")+
 nT(["Classic problem","State / recurrence","Complexity"],[["0/1 Knapsack","dp[i][w] = max(skip, take)","O(n x W)"],["Longest Common Subsequence","Match: dp[i-1][j-1] + 1, else max of two","O(n x m)"],["Longest Increasing Subsequence","dp[i] = 1 + max(dp[j]) for j before i","O(n^2) or O(n log n)"],["Edit distance","Insert, delete, replace","O(n x m)"],["Climbing stairs","dp[i] = dp[i-1] + dp[i-2]","O(n)"],["House robber","dp[i] = max(dp[i-1], dp[i-2] + x)","O(n)"]])},

{t:"18. Greedy Algorithms", h:
 nP("Choose the best option at each step without reconsidering. Correct only when the greedy-choice property and optimal substructure hold, which you should justify.")+
 nT(["Problem","Greedy choice"],[["Activity selection","Pick the earliest finishing activity"],["Fractional knapsack","Highest value per weight first"],["Huffman coding","Merge two smallest frequencies"],["Minimum platforms / meeting rooms","Sort start and end times"],["Jump game","Track farthest reachable index"],["Dijkstra / Prim / Kruskal","Smallest edge or distance first"]])+
 nT(["Greedy","Dynamic programming"],[["One choice per step, no going back","Considers all subproblems"],["Faster, simpler","Slower, more memory"],["May not give the optimal answer","Guarantees the optimal answer"]])},

{t:"19. Bit Manipulation", h:
 nT(["Operator","Symbol","Example"],[["AND","&","5 & 3 = 1"],["OR","|","5 | 3 = 7"],["XOR","^","5 ^ 3 = 6"],["NOT","~","~5 = -6"],["Left shift","<<","1 << 3 = 8"],["Right shift",">>","8 >> 2 = 2"]])+
 nT(["Trick","Meaning"],[["n & 1","True if n is odd"],["n & (n - 1)","Clear the lowest set bit"],["n & (n - 1) == 0 (n > 0)","n is a power of 2"],["x ^ x = 0, x ^ 0 = x","Find the single non-repeating number"],["1 << k","Mask with kth bit set"],["n >> 1","Divide by 2"]])+
 nC("def single_number(nums):\n    r = 0\n    for x in nums:\n        r ^= x\n    return r\n\ndef count_bits(n):\n    c = 0\n    while n:\n        n &= n - 1\n        c += 1\n    return c")},

skills.nodejs = {
  name: "Node.js",
  qa: [
    ["Basics","What is Node.js?","An open-source, cross-platform JavaScript runtime built on Chrome's V8 engine that lets you run JavaScript outside the browser, mainly for servers and tools."],
    ["Basics","Is Node.js a language, framework or library?","None of them. It is a runtime environment. JavaScript is the language, and frameworks like Express run on top of Node."],
    ["Basics","Why use Node.js?","Same language for frontend and backend, fast V8 engine, non-blocking I/O, huge npm ecosystem, and good for real-time and I/O-heavy apps."],
    ["Basics","What are the main features of Node.js?","Asynchronous and non-blocking I/O, event-driven, single-threaded event loop, cross-platform, fast execution and npm packages."],
    ["Basics","Is Node.js single-threaded?","JavaScript code runs on a single main thread, but Node uses libuv and a thread pool for async I/O, so work like file access and DNS runs in the background."],
    ["Basics","What is V8?","Google's open-source JavaScript engine written in C++. It compiles JavaScript to machine code."],
    ["Basics","What is libuv?","A C library in Node that provides the event loop, the thread pool and async I/O for files, network and timers."],
    ["Basics","Node.js vs browser JavaScript?","Browser has DOM, window and Web APIs. Node has fs, http, process and modules, but no DOM. Node uses global instead of window."],
    ["Basics","When should you not use Node.js?","For heavy CPU-bound work (video encoding, big computations) on the main thread. Use worker threads, child processes or another language for that."],
    ["Basics","What is the REPL?","Read-Eval-Print Loop. Run node with no arguments to type JavaScript and see results interactively."],
    ["Basics","What are global objects in Node?","process, console, Buffer, setTimeout, setInterval, __dirname, __filename (CommonJS), require, module, exports and globalThis."],
    ["Basics","What is the process object?","A global object with information about the running process: process.argv, process.env, process.exit(), process.cwd(), process.on('uncaughtException')."],

    ["Modules","What are modules in Node.js?","Reusable pieces of code in separate files. Node supports CommonJS (require) and ES modules (import)."],
    ["Modules","CommonJS vs ES modules?","CommonJS: require and module.exports, loaded synchronously, default in .js. ES modules: import and export, static analysis, async loading, enabled with type: 'module' or .mjs."],
    ["Modules","How does require work?","It resolves the path, loads and wraps the file in a function, executes it once, caches the result in require.cache and returns module.exports."],
    ["Modules","module.exports vs exports?","exports is a reference to module.exports. Assigning exports = something breaks the link, so use module.exports = something to export a single value."],
    ["Modules","What is the module wrapper function?","Node wraps each file in a function with exports, require, module, __filename and __dirname, which gives modules their own scope."],
    ["Modules","What are circular dependencies?","Two modules require each other. Node returns a partially loaded module, which can give undefined values. Restructure the code to avoid it."],

    ["Modules","What are core, local and third-party modules?","Core: built in (fs, path, http). Local: your own files. Third-party: installed from npm (express, mongoose)."],

    ["Event Loop & Async","What is the event loop?","A mechanism that lets Node handle many operations on one thread. It picks callbacks from queues and runs them when the call stack is empty."],
    ["Event Loop & Async","What are the phases of the event loop?","Timers, pending callbacks, idle/prepare, poll (I/O), check (setImmediate), close callbacks. Between phases, process.nextTick and promise microtasks run."],
    ["Event Loop & Async","process.nextTick vs setImmediate vs setTimeout?","nextTick runs right after the current operation, before other async work. Promise callbacks run next as microtasks. setTimeout(0) runs in the timers phase. setImmediate runs in the check phase after I/O."],
    ["Event Loop & Async","Blocking vs non-blocking code?","Blocking code (fs.readFileSync) halts the thread until done. Non-blocking code (fs.readFile) starts the work and continues, handling the result in a callback or promise."],
    ["Event Loop & Async","What is callback hell and how do you avoid it?","Deeply nested callbacks. Avoid with promises, async/await, named functions and modular code."],
    ["Event Loop & Async","What is the error-first callback pattern?","Callbacks take (err, result) where the first argument is the error or null. Always check err first."],
    ["Event Loop & Async","What is a Promise and async/await in Node?","A Promise represents a future value. async/await lets you write promise-based code in a sequential style with try/catch for errors."],

    ["Event Loop & Async","Sequential vs parallel async operations?","await a(); await b(); runs one by one. await Promise.all([a(), b()]) runs them in parallel."],

    ["Authentication & Security","How do you protect secrets?","Store them in environment variables (dotenv locally), never commit .env, and use a secrets manager in production."],
    ["Authentication & Security","How do you validate input?","Use libraries like Joi, Zod or express-validator on the server for every request, not only on the client."],
    ["Authentication & Security","What is OAuth?","An authorization framework that lets users grant an app limited access to their account on another service (Login with Google) without sharing their password."],

    ["Database (MongoDB & Mongoose)","What is Mongoose?","An ODM for MongoDB that provides schemas, models, validation, middleware and a query API."],
    ["Database (MongoDB & Mongoose)","SQL vs NoSQL?","SQL: tables, fixed schema, joins, strong consistency. NoSQL (MongoDB): flexible documents, horizontal scaling. Choose based on data shape and needs."],
    ["Database (MongoDB & Mongoose)","What is a schema and a model?","A schema defines document structure and validation. A model is a class built from the schema that you use to query the collection."],
    ["Database (MongoDB & Mongoose)","How do you connect to MongoDB?","mongoose.connect(process.env.DBURL). Start the server after the connection succeeds and handle connection errors."],
    ["Database (MongoDB & Mongoose)","What is populate()?","It replaces referenced ObjectIds with the actual documents, similar to a join."],
    ["Database (MongoDB & Mongoose)","What are indexes and why use them?","Data structures that speed up queries on fields. Without indexes MongoDB scans the entire collection."],
    ["Database (MongoDB & Mongoose)","What is aggregation?","A pipeline of stages (match, group, sort, project, lookup) that processes data on the server."],
    ["Database (MongoDB & Mongoose)","What are transactions in MongoDB?","Multi-document operations that all succeed or all fail. Need a replica set (Atlas provides one)."],
    ["Database (MongoDB & Mongoose)","How do you avoid the N+1 query problem?","Use populate, aggregation with $lookup or batch queries instead of querying inside a loop."],
    ["Database (MongoDB & Mongoose)","What is connection pooling?","Reusing a set of open database connections instead of opening a new one for every request."],

    ["Error Handling & Debugging","How do you handle errors in Node.js?","try/catch with async/await, error-first callbacks, .catch() on promises, centralized Express error middleware and process-level handlers as a last safety net."],
    ["Error Handling & Debugging","What are uncaughtException and unhandledRejection?","Process events for errors nobody caught. Log the error and exit gracefully; the process may be in an unknown state, so restart it with a process manager."],
    ["Error Handling & Debugging","Operational vs programmer errors?","Operational: expected runtime problems (database down, invalid input). Programmer: bugs (undefined variable). Handle the first and fix the second."],
    ["Error Handling & Debugging","What is a custom error class?","class AppError extends Error with statusCode and isOperational, used to return proper responses."],
    ["Error Handling & Debugging","How do you debug Node apps?","console.log, the node --inspect flag with Chrome DevTools or VS Code debugger, breakpoints, and logging with winston or pino."],
    ["Error Handling & Debugging","Why use a logging library?","Log levels, structured JSON logs, files and transports, and easier searching in production (winston, pino, morgan for requests)."],

    ["Performance & Scaling","How do you scale a Node.js application?","Run multiple instances with cluster or PM2, put a load balancer in front, use stateless servers, shared session stores, caching (Redis), database indexing and horizontal scaling."],
    ["Performance & Scaling","What is the cluster module?","It forks worker processes that share a server port so the app uses all CPU cores."],
    ["Performance & Scaling","What is PM2?","A process manager that keeps apps alive, restarts on crash, runs in cluster mode, manages logs and enables zero-downtime reloads."],
    ["Performance & Scaling","How do you improve Node.js performance?","Avoid blocking the event loop, use async APIs, caching, compression, streams for large data, database indexes, pagination, connection pooling and profile with tools."],
    ["Performance & Scaling","What is caching and where do you use it?","Storing results of expensive operations for reuse. Use Redis or in-memory caches for frequent reads, with expiry and invalidation."],
    ["Performance & Scaling","What are memory leaks in Node and their causes?","Memory that is never freed: growing global arrays or caches, unremoved event listeners, uncleared timers and large closures. Find them with heap snapshots."],
    ["Performance & Scaling","Why can't you use MemoryStore for sessions in production?","It leaks memory, resets on restart and is not shared across instances. Use Redis or MongoDB session storage."],
    ["Performance & Scaling","What is gzip compression?","The compression middleware reduces response size to speed up delivery."],

    ["Testing & Deployment","How do you test Node.js apps?","Unit tests with Jest or Mocha, API tests with Supertest, mocks for databases and services, and a separate test database."],
    ["Testing & Deployment","What are environment variables and dotenv?","Configuration values outside code (ports, secrets, URLs) read from process.env. dotenv loads them from a .env file in development."],
    ["Testing & Deployment","How do you deploy a Node.js app?","Push code to Git, build on a host (Render, Railway, AWS, Heroku), set environment variables, run npm ci and npm start, use HTTPS and a process manager."],
    ["Testing & Deployment","What is Docker and why use it with Node?","Containers package the app with its dependencies so it runs the same everywhere, easing deployment and scaling."],
    ["Testing & Deployment","What does NODE_ENV do?","Sets the environment (development, production). Production enables optimizations, secure cookies and hides error details."],
    ["Testing & Deployment","What is CI/CD?","Automated testing and deployment pipelines that run on every push (GitHub Actions)."],
    ["Testing & Deployment","What is graceful shutdown?","On SIGTERM, stop accepting new requests, finish ongoing ones, close the database connection, then exit."],

    ["Coding Questions","Write a simple Express server.","const express = require('express');\nconst app = express();\napp.use(express.json());\napp.get('/', (req, res) => res.json({ ok: true }));\napp.listen(3000, () => console.log('Running'));"],

    ["Coding Questions","Write an auth middleware.","function protect(req, res, next) {\n  if (!req.session.userId) return res.redirect('/login');\n  next();\n}"],
    ["Coding Questions","Write a custom EventEmitter example.","const EventEmitter = require('events');\nconst e = new EventEmitter();\ne.on('greet', name => console.log('Hi ' + name));\ne.emit('greet', 'Asha');"],
    ["Coding Questions","Output order: console.log(1); setTimeout(() => console.log(2), 0); setImmediate(() => console.log(3)); process.nextTick(() => console.log(4)); Promise.resolve().then(() => console.log(5)); console.log(6);","1, 6, 4, 5, then 2 and 3. The order of setTimeout 0 and setImmediate in the main module can vary; inside an I/O callback setImmediate always runs first."],
    ["Coding Questions","Write an async error wrapper.","const asyncHandler = fn => (req, res, next) =>\n  Promise.resolve(fn(req, res, next)).catch(next);"],

    ["Situation Based","Your API becomes slow under load. What do you do?","Profile to find the bottleneck, check for blocking code and slow database queries, add indexes, caching and pagination, and scale with clustering and a load balancer."],
    ["Situation Based","The server crashes with an unhandled error in production.","Check logs, fix the root cause, add proper error handling, use a process manager like PM2 to restart, and add monitoring and alerts."],
    ["Situation Based","Memory usage keeps growing.","Take heap snapshots, look for growing caches, listeners and timers, fix leaks, and restart gracefully as a stopgap."],
    ["Situation Based","How do you process a 2 GB file?","Use streams to read and process in chunks. Never load the full file into memory."],
    ["Situation Based","A user uploads large images. How do you handle it?","Limit size and type with Multer, validate on the server, store in cloud storage (S3, Cloudinary) with a CDN and save only the URL in the database."],
    ["Situation Based","Users get logged out after each deployment.","Sessions are in memory. Store sessions in MongoDB or Redis so they survive restarts and work across instances."],
    ["Situation Based","How would you send emails without slowing the response?","Push the job to a queue (Bull, RabbitMQ) and process it in a background worker. Respond to the user immediately."],
    ["Situation Based","How would you design real-time chat?","Use WebSockets (Socket.IO), authenticate the connection, use rooms, scale with a Redis adapter and persist messages in a database."],
    ["Situation Based","How do you secure a Node.js API?","HTTPS, helmet, CORS rules, rate limiting, input validation, authentication and authorization, hashed passwords, secure cookies, secret management, dependency audits and safe error messages."]

var app = document.getElementById("app");
var barbox = document.getElementById("barbox");
var groups = { projects: projects, skills: skills };

function setBar(back, title) {
  barbox.innerHTML = '<div class="bar"><div class="barin"><button class="back" onclick="' + back + '">&#8592; Back</button><h2>' + title + '</h2></div></div>';
}

function menu(heading, buttons) {
  app.innerHTML = '<div class="home menu"><h2>' + heading + '</h2><div class="btns">' + buttons + '</div></div>';
  window.scrollTo(0, 0);
}

function btn(label, action) {
  return '<button class="pbtn" onclick="' + action + '">' + label + '</button>';
}

function showHome() {
  barbox.innerHTML = "";
  app.innerHTML = '<div class="home"><h2>Choose a section</h2><div class="btns">' +
    btn("Skills", "showMenu('skills')") + btn("Projects", "showMenu('projects')") + '</div></div>';
  window.scrollTo(0, 0);
}

function showMenu(g) {
  setBar("showHome()", g === "skills" ? "Skills" : "Projects");
  var b = "";
  for (var k in groups[g]) {
    b += btn(groups[g][k].name, g === "skills" ? "showSkill('" + k + "')" : "showTopic('projects','" + k + "')");
  }
  menu(g === "skills" ? "Choose a skill" : "Choose a project", b);
}

function showSkill(k) {
  setBar("showMenu('skills')", skills[k].name);
  menu("Choose Notes or Questions",
    btn("Notes", "showNotes('" + k + "')") + btn("Questions", "showTopic('skills','" + k + "')"));
}

function showTopic(g, key) {
  var p = groups[g][key];
  var cats = [];
  p.qa.forEach(function (x) { if (cats.indexOf(x[0]) < 0) cats.push(x[0]); });
  var args = "'" + g + "','" + key + "'";
  setBar(g === "skills" ? "showSkill('" + key + "')" : "showMenu('projects')", p.name + (g === "skills" ? " - Questions" : ""));
  var h = "";
  if (p.intro) h += '<div class="note">' + p.intro + '</div>';
  h += '<div class="tools"><input id="s" placeholder="Search questions..." oninput="draw(' + args + ')">';
  h += '<select id="c" onchange="draw(' + args + ')"><option value="">All categories</option>';
  cats.forEach(function (c) { h += '<option>' + c + '</option>'; });
  h += '</select></div><div class="count" id="n"></div><div id="list"></div>';
  app.innerHTML = h;
  draw(g, key);
  window.scrollTo(0, 0);
}

function showNotes(key) {
  setBar("showSkill('" + key + "')", skills[key].name + " - Notes");
  app.innerHTML = '<div class="tools"><input id="s" placeholder="Search notes..." oninput="drawNotes(\'' + key + '\')"></div><div class="count" id="n"></div><div id="list"></div>';
  drawNotes(key);
  window.scrollTo(0, 0);
}

function drawNotes(key) {
  var q = document.getElementById("s").value.toLowerCase();
  var out = "", total = 0;
  skills[key].notes.forEach(function (x) {
    if (q && (x.t + " " + x.h.replace(/<[^>]+>/g, " ")).toLowerCase().indexOf(q) < 0) return;
    out += '<div class="q"><button onclick="toggleQ(this)">' + esc(x.t) + '</button><div class="nbody">' + x.h + '</div></div>';
    total++;
  });
  document.getElementById("list").innerHTML = out || '<div class="empty">No topics found.</div>';
  document.getElementById("n").textContent = total + " topics";
}

function toggleQ(btn) {
  var item = btn.parentNode;
  var wasOpen = item.classList.contains("open");
  var all = document.querySelectorAll(".q.open");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("open");
  if (!wasOpen) item.classList.add("open");
}

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function draw(g, key) {
  var q = document.getElementById("s").value.toLowerCase();
  var c = document.getElementById("c").value;
  var out = "", last = "", total = 0;
  groups[g][key].qa.forEach(function (x) {
    if (c && x[0] !== c) return;
    if (q && (x[1] + " " + x[2]).toLowerCase().indexOf(q) < 0) return;
    if (x[0] !== last) { out += '<div class="cat">' + x[0] + '</div>'; last = x[0]; }
    out += '<div class="q"><button onclick="toggleQ(this)">' + esc(x[1]) + '</button><div class="a">' + esc(x[2]) + '</div></div>';
    total++;
  });
  document.getElementById("list").innerHTML = out || '<div class="empty">No questions found.</div>';
  document.getElementById("n").textContent = total + " questions";
}

var topBox = document.getElementById("top");
window.addEventListener("scroll", function () {
  var y = window.scrollY;
  if (y > 40) topBox.classList.add("small");
  else if (y < 10) topBox.classList.remove("small");
});

showHome();
</script>
</body>
